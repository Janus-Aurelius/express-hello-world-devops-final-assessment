name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "feature/devops" ]
  pull_request:
    branches: [ "main", "master", "feature/devops" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Buoc 1: Kiem tra ma nguon (Checkout source code)
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Thong bao thanh cong buoc checkout
      if: ${{ success() }}
      run: echo 'Da lay ma nguon thanh cong'

    - name: Thong bao that bai buoc checkout
      if: ${{ failure() }}
      run: echo 'Loi Khong the lay ma nguon'

    # Buoc 2: Cai dat thu vien (Install dependencies)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Thong bao thanh cong buoc cai dat thu vien
      if: ${{ success() }}
      run: echo 'Da cai dat thu vien thanh cong'

    - name: Thong bao that bai buoc cai dat thu vien
      if: ${{ failure() }}
      run: echo 'Loi Cai dat thu vien that bai'

    # Buoc 3: Kiem tra code (Test)
    - name: Test
      run: npm run test

    - name: Thong bao thanh cong buoc kiem tra
      if: ${{ success() }}
      run: echo 'Kiem tra ma nguon thanh cong'

    - name: Thong bao that bai buoc kiem tra
      if: ${{ failure() }}
      run: echo 'Loi Kiem tra ma nguon that bai'

    # Buoc 4: Xay dung Docker image (Build docker image)
    - name: Build Docker image
      run: docker build -t express-hello-world .

    - name: Thong bao thanh cong buoc xay dung Docker
      if: ${{ success() }}
      run: echo 'Xay dung Docker image thanh cong'

    - name: Thong bao that bai buoc xay dung Docker
      if: ${{ failure() }}
      run: echo 'Loi Xay dung Docker image that bai'
